[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hakimi-node-agent"
version = "2.2.0"
description = "Standalone CN execution node agent for Hakimi (Bilibili collector & Minecraft local WS bridge)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "pillow>=12,<13",
  "pydantic-settings>=2.7,<3",
  "websockets>=15,<18",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["node_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["node_agent"]
